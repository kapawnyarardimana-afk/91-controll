
name: Build 91 CONTROLLER APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP website tidak ditemukan"
            exit 1
          fi

          mkdir -p extracted www
          unzip -o "$ZIP_FILE" -d extracted

          HTML_FILE=$(find extracted -type f -name "index.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          fi

          WEBSITE_DIR=$(dirname "$HTML_FILE")
          cp -r "$WEBSITE_DIR"/. www/

          if [ -f "$WEBSITE_DIR/assets/icon.png" ]; then
            mkdir -p assets
            cp "$WEBSITE_DIR/assets/icon.png" assets/icon.png
          fi

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets
          npx cap init "91 CONTROLLER" "com.ninespeedshop.controller" --web-dir www
          npx cap add android

      - name: Generate App Icon
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor "#080d13"
          else
            echo "ERROR: assets/icon.png tidak ditemukan"
            exit 1
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 91-CONTROLLER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
